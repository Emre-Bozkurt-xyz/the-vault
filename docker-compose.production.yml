name: vault

services:
  web:
    build:
      context: .
      target: runner
    container_name: vault-web
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    ports:
      # Bind locally on the mini-PC. Expose publicly only through FRP + VPC Caddy.
      - "127.0.0.1:18210:3000"
    depends_on:
      postgres:
        condition: service_healthy
      collab:
        condition: service_started
    networks:
      - vault_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      target: builder
    container_name: vault-migrate
    restart: "no"
    env_file:
      - path: .env.production
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - vault_internal
    profiles:
      - migrate

  collab:
    build:
      context: .
      dockerfile: Dockerfile.collab
    container_name: vault-collab
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      COLLAB_PORT: 1234
    ports:
      - "127.0.0.1:18211:1234"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault_internal

  # Code execution runner (Phase 24). Started by scripts/deploy.sh only when
  # CODE_EXECUTION_ENABLED=true, hence the profile. See runner/README.md.
  runner:
    build:
      context: ./runner
      dockerfile: worker.Dockerfile
    container_name: vault-runner
    restart: unless-stopped
    init: true
    # No env_file: this service must never see the database, OAuth or storage
    # credentials. The runner token is the one value it gets from .env.production.
    environment:
      CODE_RUNNER_URL: http://web:3000
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
      CODE_RUNNER_ID: vault-runner
      # Job workspaces are bind-mounted into sandboxes by the HOST daemon, so
      # they must live at a path that means the same thing on both sides.
      TMPDIR: /var/lib/vault-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/vault-runner:/var/lib/vault-runner
    depends_on:
      web:
        condition: service_started
    # SIGTERM lets the current job finish (compile 30s + run 10s at most).
    stop_grace_period: 60s
    networks:
      - vault_internal
    profiles:
      - runner

  postgres:
    image: postgres:16-alpine
    container_name: vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - vault_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault_internal

volumes:
  vault_postgres:

networks:
  vault_internal:
    driver: bridge
